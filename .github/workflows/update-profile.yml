name: Refresh profile card

on:
  push:
    branches:
      - main
    paths:
      - profile.toml
      - assets/ascii-portrait.txt
      - assets/profile-template.svg
      - scripts/generate_profile.py
      - tests/test_generate_profile.py
      - .github/workflows/update-profile.yml
  schedule:
    - cron: "17 12 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-card-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Generate and publish SVG cards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run generator tests
        run: python -m unittest discover -s tests -v

      - name: Refresh public profile statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_profile.py --strict

      - name: Commit generated files
        run: |
          git add assets/profile-dark.svg assets/profile-light.svg cache/stats.json
          if git diff --cached --quiet; then
            echo "Profile card is already current."
            exit 0
          fi
          git config user.name "elymas-profile[bot]"
          git config user.email "elymas-profile[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile card"
          git push
